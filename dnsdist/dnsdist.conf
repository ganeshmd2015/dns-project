-- dnsdist configuration for DNS traffic distribution
-- Routes queries to appropriate backend DNS servers based on zone

-- Listen on all interfaces
setLocal("0.0.0.0:53", {})

-- Web server for monitoring and management
webserver("0.0.0.0:8083")
setWebserverConfig({password="changeme-dnsdist-password", apiKey="changeme-dnsdist-api-key"})

-- Control socket
controlSocket("0.0.0.0:5199")

-- Add backend DNS servers
-- pjdns - legacy DNS server
newServer({address="pjdns:53", name="pjdns", pool="legacy"})

-- PowerDNS servers for different zones
newServer({address="powerdns-zone1:53", name="powerdns-zone1", pool="zone1"})
newServer({address="powerdns-zone2:53", name="powerdns-zone2", pool="zone2"})
newServer({address="powerdns-zone3:53", name="powerdns-zone3", pool="zone3"})

-- Default backend pool (all PowerDNS servers for load balancing)
newServer({address="powerdns-zone1:53", name="powerdns-zone1-default", pool=""})
newServer({address="powerdns-zone2:53", name="powerdns-zone2-default", pool=""})
newServer({address="powerdns-zone3:53", name="powerdns-zone3-default", pool=""})

-- Routing rules based on domain patterns
-- Route zone1.example.com queries to zone1 pool
addAction(SuffixMatchNodeRule("zone1.example.com"), PoolAction("zone1"))

-- Route zone2.example.com queries to zone2 pool
addAction(SuffixMatchNodeRule("zone2.example.com"), PoolAction("zone2"))

-- Route zone3.example.com queries to zone3 pool
addAction(SuffixMatchNodeRule("zone3.example.com"), PoolAction("zone3"))

-- Route example.com queries (without zone prefix) to legacy pjdns
addAction(SuffixMatchNodeRule("example.com"), PoolAction("legacy"))

-- Load balancing policy
setServerPolicy(leastOutstanding)

-- Cache settings
pc = newPacketCache(10000, {
    maxTTL=86400,
    minTTL=0,
    temporaryFailureTTL=60,
    staleTTL=60,
    dontAge=false
})
getPool(""):setCache(pc)

-- Logging
setVerboseHealthChecks(true)

-- ACL - Allow queries from any IP (adjust for production)
setACL({'0.0.0.0/0', '::/0'})

-- Statistics
-- Access via web interface at http://localhost:8083

print("dnsdist configuration loaded successfully")
print("Routing rules:")
print("  - *.zone1.example.com -> powerdns-zone1")
print("  - *.zone2.example.com -> powerdns-zone2")
print("  - *.zone3.example.com -> powerdns-zone3")
print("  - *.example.com -> pjdns (legacy)")
print("  - Other queries -> Load balanced across all PowerDNS servers")
