# PowerDNS Configuration for Zone 1
# SQLite backend configuration

# Server configuration
setuid=pdns
setgid=pdns

# API configuration
api=yes
api-key=changeme-zone1-api-key
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

# Launch SQLite backend
launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/zone1.sqlite3

# DNS configuration
local-address=0.0.0.0
local-port=53

# Enable AXFR (zone transfers)
allow-axfr-ips=0.0.0.0/0
master=yes
slave=no

# Logging
log-dns-queries=yes
log-dns-details=yes
loglevel=5

# Security
security-poll-suffix=
